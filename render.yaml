services:
  - type: web
    name: rendiciones
    runtime: python
    plan: free
    repo: https://github.com/tizianodistribuidoraacero-stack/rendiciones
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT server:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: nicolasd@distribuidoracero.com.ar
      - key: MAIL_FROM
        value: nicolasd@distribuidoracero.com.ar
      - key: MAIL_TO
        value: nicolasd@distribuidoracero.com.ar
      - key: SMTP_PASSWORD
        sync: false
